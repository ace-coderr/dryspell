[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/vectors" }, { access = "read", path = "../../data/generated" }]

gas_limit = "9223372036854775807"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
